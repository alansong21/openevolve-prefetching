max_iterations: 20
checkpoint_interval: 1
language: cpp
file_suffix: ".cc"

evaluator:
  timeout: 1800          # ChampSim runs are long; give the process time to finish
  parallel_evaluations: 1 # Rebuilds are serialized to avoid clobbering artifacts
  cascade_evaluation: false
  use_llm_feedback: false

llm:
  primary_model: "gpt-4o-mini"
  primary_model_weight: 1.0
  api_base: "https://api.openai.com/v1"
  temperature: 0.4
  max_tokens: 2000
  timeout: 120

prompt:
  system_message: |
    You are designing a hardware data prefetcher for the ChampSim simulator. The baseline is a trivial next-line prefetcher and has plateaued at IPC=1.207 on the perlbench trace. You MUST implement bold, non-trivial changes each iteration: infer longer strides, issue multiple lookahead prefetches, gate them on access type and cache hit/miss context, and modify both state tracking and prefetch degree. It is acceptable to rewrite the entire EVOLVE block if needed. Keep the interface compatible with ChampSim modules (same class name, signatures, includes) but do not submit cosmetic edits or one-line tweaks—every revision must introduce a materially different algorithm.

# Keep the evolutionary population small so each expensive ChampSim run still makes progress.
database[q]:
  population_size: 12
  archive_size: 6
  num_islands: 1
  exploration_ratio: 0.9
  exploitation_ratio: 0.1
  elite_selection_ratio: 0.01
  log_prompts: true
