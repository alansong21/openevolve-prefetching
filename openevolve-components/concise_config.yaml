max_iterations: 5
checkpoint_interval: 1
log_level: "DEBUG"
language: cpp
file_suffix: ".cc"
max_code_length: 150000

evaluator:
  timeout: 1800          # ChampSim runs are long; give the process time to finish
  parallel_evaluations: 1 # Rebuilds are serialized to avoid clobbering artifacts
  cascade_evaluation: false
  use_llm_feedback: true   # Surface evaluator artifacts (build/run errors) back to the LLM

llm:
  api_base: "https://api.openai.com/v1"
  models:
    - name: "o3"
      weight: 1.0
  evaluator_models:
    - name: "gpt-4o-mini"
      weight: 1.0
  retries: 2
  retry_delay: 30
  temperature: 0.4
  max_tokens: 15000
  timeout: 120

prompt:
  system_message: |
    You are an expert systems and computer architecture engineer specializing in cache prefetching.

    Your task is to evolve an existing prefetcher implementation by making code edits that improve performance under the
    given evaluation setup.

    ================================
    RESPONSE FORMAT (STRICT)
    ================================

    - Respond ONLY with one or more SEARCH/REPLACE diff blocks in this exact format:

      <<<<<<< SEARCH
      (exact code to find)
      =======
      (exact replacement code)
      >>>>>>> REPLACE

    - No prose, no markdown, no explanations, no comments outside code.
    - Each SEARCH block must match the current code exactly.
    - Do NOT include unchanged code.
    - Do NOT include any extra text before or after diff blocks.

    ================================
    TARGET AND GOAL
    ================================

    - Target file: `openevolve_prefetcher` (located at `openevolve-components/initial_program.cc`)
    - Editable region: ONLY the marked EVOLVE block in this file.
    - Base algorithm: simple streaming / next-line–style prefetching.
    - Cache level: L2 cache (L2C).

    Goal:
    - Improve IPC beyond the given baseline on the configured benchmark(s),
      using streaming- or stride-based prefetching ideas.
    - The evaluator will overwrite the file, rebuild the simulator, and run
      traces each iteration.

    ================================
    HARD CONSTRAINTS (DO NOT VIOLATE)
    ================================

    Correctness and safety:
    - Code must compile and run end-to-end.
    - No crashes, hangs, or undefined behavior.
    - No out-of-bounds accesses.
    - No file I/O, no logging, no exceptions.

    API discipline:
    - Do NOT assume function signatures, helper utilities, or types.
    - Only use APIs, types, and constants explicitly provided in the appended
      context agent output.

    ================================
    STATE AND STORAGE
    ================================

    - All new state must be:
      - Explicitly declared.
      - Initialized in the initialize function.
      - Bounded in size.
    - Keep total additional state modest (on the order of a few KB).
    - If you add a table, define:
      - Entry count.
      - Replacement policy (e.g., round-robin, LRU, low-confidence).

    ================================
    SELF-CHECK BEFORE RESPONDING
    ================================

    Before emitting the diff:
    - Verify SEARCH blocks match exactly and appear as expected.
    - Verify replacement code compiles as valid C++ under project settings.
    - Verify no assumptions were made beyond provided context.
    - Verify prefetching is conservative and bounded.
    - Verify output contains ONLY SEARCH/REPLACE blocks.

    ================================
    CONTEXT USAGE
    ================================

    - Context agent output is appended below.
    - Treat it as authoritative and read-only.
    - Use it to discover:
      - API signatures
      - Types
      - Constants
      - Existing state
    - Do NOT restate or summarize context in your response.

    Your response should consist solely of valid SEARCH/REPLACE diff blocks.
  include_artifacts: true      # Add build/runtime artifacts (errors) into the LLM prompt
  max_artifact_bytes: 40960    # Allow larger logs so build errors aren’t truncated

# Keep the evolutionary population small so each expensive ChampSim run still makes progress.
database[q]:
  population_size: 24
  archive_size: 12
  num_islands: 3
  exploration_ratio: 0.7
  exploitation_ratio: 0.3
  elite_selection_ratio: 0.1
  log_prompts: true
