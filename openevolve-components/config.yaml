max_iterations: 5
checkpoint_interval: 1
language: cpp
file_suffix: ".cc"

evaluator:
  timeout: 1800          # ChampSim runs are long; give the process time to finish
  parallel_evaluations: 1 # Rebuilds are serialized to avoid clobbering artifacts
  cascade_evaluation: false
  use_llm_feedback: true   # Surface evaluator artifacts (build/run errors) back to the LLM

llm:
  api_base: "https://api.openai.com/v1"
  models:
    - name: "gpt-4o"
      weight: 1.0
  evaluator_models:
    - name: "gpt-4o-mini"
      weight: 1.0
  retries: 5
  retry_delay: 5
  temperature: 0.4
  max_tokens: 10000
  timeout: 120

prompt:
  system_message: |
    =====================
    PROBLEM OVERVIEW
    =====================
    Core task:
      • Evolve the EVOLVE block inside `openevolve_prefetcher` (champsim_prefetcher/initial_program.cc) beyond the trivial next-line prefetcher.
      • Keep exploring bold streaming/stride ideas (multi-lookahead, per-PC stride tracking, adaptive throttles) that can beat the 1.207 IPC baseline on perlbench.

    Critical implementation pitfalls observed in artifacts:
      1. `std::unordered_map` + ChampSim address types: `champsim::address`, `champsim::block_number`, and `champsim::address_slice<>` DO NOT have `std::hash` specializations. Do not key unordered_map/unordered_set with them unless you also define a custom hash functor. Instead:
         • Convert to raw integers (e.g., `uint64_t tag = static_cast<uint64_t>(champsim::address(addr).address);`) before hashing, or
         • Use ordered containers keyed by integers, or
         • Supply a custom hash over `uint64_t` tags and store those tags as keys.
      2. Mixing `champsim::address` and `champsim::block_number`: arithmetic operators are NOT interchangeable. Always convert to plain integers before computing strides, and keep stored members consistently typed:
         ```
         champsim::block_number current_block{addr};
         int64_t current = static_cast<int64_t>(current_block.value);
         int64_t last = static_cast<int64_t>(entry.last_block.value);
         int64_t stride = current - last;
         entry.last_block = current_block;
         ```
      3. Struct initialization: define constructors or helper setters instead of assigning brace-initializers into map entries (`stride_table[ip] = StrideEntry{...};` or `emplace`).
      4. Declare shared state (prefetch tables, confidence thresholds, helper structs) near the top of the EVOLVE block so every method sees the same globals; missing declarations (`stride_table`, `CONFIDENCE_THRESHOLD`, etc.) produce scope errors.
      5. When computing stride deltas, convert ChampSim types to integers via the provided APIs (`block.to<int64_t>()`, `addr.slice_lower<...>().to<uint64_t>()`) rather than mixing `champsim::block_number` and `champsim::address` directly or accessing private `.value` members.

    =====================
    EVALUATION CRITERIA
    =====================
    Optimization goal:
      • Maximize IPC measured by the ChampSim evaluator on perlbench while staying within hardware-plausible prefetching (streaming/stride family).

    Correctness & safety:
      • Keep ChampSim APIs intact and compile cleanly—hash/type errors immediately zero out IPC.
      • Prefetch only cache-line-aligned addresses derived via simple arithmetic; no I/O or architecture state mutation.

    Success signal:
      • Code builds without the recurring hash/type errors, runs end-to-end, and reports IPC > 1.207. Aggressive algorithms must justify extra bandwidth by tracking usefulness or throttling.

    =====================
    CONTEXT & REQUIRED APIS
    =====================
    Environment:
      • Evaluator rewrites champsim_prefetcher/initial_program.cc, rebuilds ChampSim, and runs perlbench. APIs exposed:

          void prefetcher_initialize();
          uint32_t prefetcher_cache_operate(champsim::address addr,
                                            champsim::address ip,
                                            uint8_t cache_hit,
                                            bool useful_prefetch,
                                            access_type type,
                                            uint32_t metadata_in);
          uint32_t prefetcher_cache_fill(champsim::address addr, long set, long way,
                                         uint8_t prefetch, champsim::address evicted_addr,
                                         uint32_t metadata_in);
          void prefetcher_cycle_operate();

      • Issue requests via `prefetch_line(champsim::address target, bool fill_this_level, uint32_t metadata)`. The `metadata` you pass comes back as `metadata_in` on both cache_operate and cache_fill so you can store per-line context without global tables.
      • Demand accesses arrive in `prefetcher_cache_operate`; fills arrive in `prefetcher_cache_fill` for accuracy accounting. `cache_hit` reflects the L2 hit/miss result, and `useful_prefetch` indicates whether a prior prefetch supplied the line.
      • `access_type` can be `LOAD`, `RFO`, `PREFETCH`, `WRITE`, or `TRANSLATION`, allowing you to gate behavior per request type.
      • Prefetcher API reminders:
        - Only implement the member functions declared in `openevolve_prefetcher.h` (`prefetcher_initialize`, `prefetcher_cache_operate`, `prefetcher_cache_fill`, `prefetcher_cycle_operate`). Do not redefine the class in initial_program.cc.
        - `prefetcher_cache_operate(addr, ip, cache_hit, useful_prefetch, access_type type, metadata_in)` runs on every tag probe. `addr` is block-aligned; `ip` is the triggering instruction (0 for prefetched packets). Use `cache_hit`/`useful_prefetch` to gate aggressiveness and return the metadata that should accompany the block.
        - `prefetcher_cache_fill(addr, set, way, prefetch, evicted_addr, metadata_in)` fires on fills; return the metadata that should stick with the stored line.
        - `prefetcher_cycle_operate()` is your per-cycle maintenance hook.
        - Always use `prefetch_line(champsim::address target, bool fill_this_level, uint32_t metadata_out)` when issuing requests; that metadata comes back as `metadata_in`.
      • ChampSim address slices are strong types:
        - Build them explicitly (`champsim::block_number block{addr};`) and convert to integers via `.to<T>()` (`uint64_t pc = ip.to<uint64_t>();`, `int64_t stride = block.to<int64_t>() - last_block.to<int64_t>();`).
        - Never access `.data`/`.value`, and don’t subtract mismatched slice types—convert both operands first or use `champsim::offset`.
        - Slices already encode scaling, so `block + stride` interprets stride in block units.

    Implementation guidance:
      • Every edit should focus on a single coherent improvement (per-PC stride table, adaptive distance controller, etc.) while applying the above compile fixes.
      • Initialize all state in `prefetcher_initialize`, keep tables bounded, and include a brief comment noting WHAT/WHY/TRADEOFFS.
      • Aggressiveness must be gated by accuracy metrics to avoid bandwidth waste.

    =====================
    RESPONSE FORMAT
    =====================
    - Respond ONLY with SEARCH/REPLACE diff blocks in the exact format:
      <<<<<<< SEARCH
      (code to find)
      =======
      (code to replace)
      >>>>>>> REPLACE
    - No prose, no extra text outside these blocks.

